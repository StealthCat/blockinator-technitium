name: Build Technitium add-on

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package-name: ${{ steps.package.outputs.name }}
    env:
      TECHNITIUM_VERSION: '15.6.2'
      TECHNITIUM_SHA256: '51f2d4ebaf156a85035e820afde5e1d428f1920a37d7f0c65203fb1766917e08'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Technitium reference assemblies
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/technitium.tar.gz"
          curl --fail --location --retry 3 \
            "https://download.technitium.com/dns/archive/${TECHNITIUM_VERSION}/DnsServerPortable.tar.gz" \
            --output "$archive"
          echo "$TECHNITIUM_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/technitium"
          tar -xzf "$archive" -C "$RUNNER_TEMP/technitium"
          test -s "$RUNNER_TEMP/technitium/DnsServerCore.ApplicationCommon.dll"
          test -s "$RUNNER_TEMP/technitium/TechnitiumLibrary.Net.dll"

      - name: Build installable add-on
        run: bash ./build-plugin.sh "$RUNNER_TEMP/technitium"

      - name: Validate and name package
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          import zipfile

          version = ET.parse('RemotePolicyBlockingApp.csproj').findtext('./PropertyGroup/Version')
          if not version or not re.fullmatch(r'\d+\.\d+(?:\.\d+)?(?:-[A-Za-z0-9.-]+)?', version):
              raise SystemExit(f'Invalid project version: {version!r}')
          tag = os.environ.get('RELEASE_TAG', '')
          package_version = tag.removeprefix('v') if tag else version
          # Existing releases use two-component tags, e.g. 1.3 for version 1.3.0.
          if package_version not in {version, version.removesuffix('.0')}:
              raise SystemExit(f'Release tag {tag!r} does not match project version {version}')
          required = {'RemotePolicyBlockingApp.dll', 'RemotePolicyBlockingApp.deps.json',
                      'dnsApp.config', 'README.md'}
          source = Path('dist/RemotePolicyBlockingApp.zip')
          with zipfile.ZipFile(source) as archive:
              if len(archive.namelist()) != len(required) or set(archive.namelist()) != required:
                  raise SystemExit(f'Unexpected ZIP contents: {archive.namelist()}')
              if archive.testzip() is not None or any(entry.file_size == 0 for entry in archive.infolist()):
                  raise SystemExit('ZIP contains a corrupt or empty file')
              json.loads(archive.read('RemotePolicyBlockingApp.deps.json'))
              json.loads(archive.read('dnsApp.config'))
          name = f'Blockinator_v{package_version}.zip'
          source.rename(source.with_name(name))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Built **{name}** against Technitium 15.6.2.\n\n'
                            'Download the artifact, extract the outer GitHub artifact ZIP, '
                            'then upload the contained Blockinator ZIP in Technitium **Apps**.\n')

      - name: Upload installable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build.outputs.package-name }}
          path: dist

      - name: Attach add-on to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
        run: gh release upload "$RELEASE_TAG" "dist/$PACKAGE_NAME" --clobber
